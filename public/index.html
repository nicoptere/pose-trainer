<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Classifier - Live Detection</title>
    <link rel="stylesheet" href="style.css">
    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>Gesture Classifier</h1>
        <p class="subtitle">Temporal gesture detection with 4-second window</p>

        <div class="controls">
            <div class="source-selector">
                <label>
                    <input type="radio" name="source" value="webcam" checked>
                    Webcam
                </label>
                <label>
                    <input type="radio" name="source" value="file">
                    Upload Video
                </label>
            </div>
            <div class="file-upload" style="display: none;">
                <input type="file" id="video-file" accept="video/*">
                <button id="process-video-btn">Process Video</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="video-section">
                <div class="video-container">
                    <video class="input_video"></video>
                    <canvas class="output_canvas" width="1280px" height="720px"></canvas>
                    <div id="loading">Loading model...</div>
                </div>
                <div class="result-container">
                    <h2>Detected Gesture:</h2>
                    <div id="pose-result" class="pose-label">Waiting...</div>
                    <div class="confidence-container">
                        <div id="confidence" class="confidence-bar"></div>
                    </div>
                    <div class="info-text">
                        <p>📊 The model analyzes 30 frames (~4 seconds) to classify your gesture</p>
                        <p>💡 Perform smooth, deliberate movements for best results</p>
                    </div>
                </div>
            </div>

            <div class="clusters-section">
                <h2>Gesture Clusters</h2>
                <div id="cluster-grid" class="cluster-grid">
                    <!-- Cluster cards will be dynamically generated here -->
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
